<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>ArcaeaPTTTracker - Redirecting...</title>
  <script type="text/javascript">
    // Single Page Apps for GitHub Pages
    // MIT License
    // https://github.com/rafgraph/spa-github-pages
    // This script checks if the redirect is necessary and redirects the visitor to the index.html page
    // with the path and query string as a query parameter.
    
    // Set pathSegmentsToKeep to 1 since our repository/base path is /ArcaeaPTTTracker/
    var pathSegmentsToKeep = 1;

    var l = window.location;
    l.replace(
      l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
      l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
      l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
      (l.search ? '&q=' + l.search.slice(1).replace(/&/g, '~and~') : '') +
      l.hash
    );
  </script>
</head>
<body>
  <p>Redirecting to ArcaeaPTTTracker...</p>
</body>
</html>
