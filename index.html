<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/ArcaeaPTTTracker/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ArcaeaPTTTracker</title>
    <!-- Start Single Page Apps for GitHub Pages -->
    <script type="text/javascript">
      (function(l) {
        if (l.search[1] === '/' ) {
          var decoded = l.search.slice(1).split('&').map(function(s) { 
            return s.replace(/~and~/g, '&')
          }).join('?');
          window.history.replaceState(null, null,
              l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      }(window.location));
    </script>
    <!-- End Single Page Apps for GitHub Pages -->
    <script>
      (function() {
        const savedTheme = localStorage.getItem('arcaea_theme_preference');
        const systemPrefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        const shouldBeDark = savedTheme !== null ? (savedTheme === 'dark') : systemPrefersDark;
        if (shouldBeDark) {
          document.documentElement.classList.add('p-dark');
        } else {
          document.documentElement.classList.remove('p-dark');
        }
      })();
    </script>
    <script type="module" crossorigin src="/ArcaeaPTTTracker/assets/main-5KhAv0ib.js"></script>
    <link rel="stylesheet" crossorigin href="/ArcaeaPTTTracker/assets/main-C22qVO2T.css">
  </head>
  <body>
    <div id="app"></div>
  </body>
</html>
